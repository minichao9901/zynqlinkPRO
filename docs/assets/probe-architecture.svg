<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">zynqlinkPRO：硬件采集，本机分析</title>
  <desc id="desc">目标MCU的并行Trace进入FPGA接收与成帧，经Zynq PS和DDR缓冲、USB传到本机工作台分析。工作台通过CMSIS-DAP和SWD/JTAG控制目标。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#57606a"/></marker><marker id="control" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0969da"/></marker></defs>
  <rect x="1" y="1" width="998" height="278" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="34" font-size="19" font-weight="600" fill="#1f2328">硬件采集 · 本机分析</text>
    <g fill="#fff" stroke="#afb8c1" stroke-width="1.3">
      <rect x="24" y="72" width="180" height="96" rx="8"/>
      <rect x="254" y="72" width="180" height="96" rx="8"/>
      <rect x="484" y="72" width="180" height="96" rx="8"/>
      <rect x="714" y="72" width="262" height="96" rx="8"/>
    </g>
    <g font-size="17" font-weight="600" fill="#1f2328">
      <text x="114" y="107">目标 Cortex-M</text><text x="344" y="107">FPGA / PL</text>
      <text x="574" y="107">Zynq PS + DDR</text><text x="845" y="101">本机工作台</text>
    </g>
    <g font-size="13" fill="#57606a">
      <text x="114" y="136">SWD / JTAG · ETM</text><text x="344" y="136">Trace 接收与成帧</text>
      <text x="574" y="136">窗口 / 环形缓冲 · USB</text><text x="845" y="127">OpenCSD → TraceStore → Web</text>
      <text x="845" y="149">输入目标 ELF / DWARF / 源码</text>
      <text x="229" y="103">Trace</text><text x="689" y="103">USB</text>
    </g>
    <path d="M205 120H251 M435 120H481 M665 120H711" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M845 169V211H114V171" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#control)"/>
    <rect x="340" y="197" width="330" height="27" rx="5" fill="#f6f8fa"/>
    <text x="505" y="216" font-size="14" fill="#0969da">CMSIS-DAP · SWD / JTAG 调试控制</text>
    <text x="500" y="257" font-size="13" fill="#57606a">ETM 采集与原生分析在本机运行，在线工作台提供直接调试与下载入口。</text>
  </g>
</svg>
